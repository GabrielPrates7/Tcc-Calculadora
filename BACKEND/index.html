<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema TCC - Início</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 50px;
        }
        .menu-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            text-decoration: none;
            color: #333;
            border: 1px solid #ddd;
        }
        .menu-card:hover {
            transform: translateY(-5px);
            border-color: #9cc2e5;
        }
        .icon { font-size: 40px; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

    <h1 style="text-align: center;">Sistema de Custos Industriais</h1>
    <p style="text-align: center; color: #666;">Bem-vindo, Gabriel.</p>

    <div class="menu-container">
        <a href="pages/funcionarios.html" class="menu-card">
            <span class="icon">👷‍♂️</span>
            <h3>Funcionários</h3>
            <p>Cadastrar e calcular custos trabalhistas</p>
        </a>

        <a href="#" class="menu-card" style="opacity: 0.6;">
            <span class="icon">⚙️</span>
            <h3>Configurações</h3>
            <p>(Em breve)</p>
        </a>
    </div>

</body>
</html>
