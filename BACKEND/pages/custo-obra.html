<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Custo de Obra</title>
    <link rel="stylesheet" href="../css/global.css">
    <style>
        body { background-color: #f4f4f9; padding: 20px; font-family: 'Segoe UI', sans-serif; }
        
        /* Layout Principal */
        .container-calculo {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        /* Cartão de Configuração (Esquerda) */
        .card-config {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 300px;
        }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; }
        
        select, input { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            font-size: 1em;
            box-sizing: border-box; /* Garante que o padding não estoure a largura */
        }

        /* Cartão de Resultado (Direita - Estilo Excel Verde) */
        .card-resultado {
            background: #d4edda; /* Fundo verde claro */
            border: 2px solid #27ae60;
            padding: 0;
            border-radius: 8px;
            flex: 1;
            min-width: 300px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .titulo-resumo {
            background-color: #27ae60;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
        }

        .linha-resumo {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            border-bottom: 1px solid #c3e6cb;
            font-size: 1.1em;
        }

        .valor-destaque { font-weight: bold; font-size: 1.2em; }
        
        .linha-final {
            background-color: #c3e6cb;
            font-weight: bold;
            font-size: 1.4em;
            color: #155724;
            border-bottom: none;
        }

        button.btn-calcular {
            background-color: #2c3e50;
            color: white;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button.btn-calcular:hover { background-color: #1a252f; }

    </style>
</head>
<body>

    <a href="../index.html" style="text-decoration: none; color: #555;">&larr; Voltar ao Início</a>
    <h2>Custo de Obra (Produção)</h2>

    <div class="container-calculo">
        
        <div class="card-config">
            <h3>⚙️ Parâmetros de Trabalho</h3>
            
            <div class="input-group">
                <label>Base de Tempo:</label>
                <div style="display: flex; gap: 10px;">
                    <select id="select-modo" onchange="atualizarLabels()">
                        <option value="dias">Dias por Mês</option>
                        <option value="horas">Horas por Mês</option>
                    </select>
                    <input type="number" id="input-qtd-tempo" value="20">
                </div>
            </div>

            <div class="input-group">
                <label>Estrutura da Equipe:</label>
                <select id="select-tipo-equipe">
                    <option value="individual">Trabalham Sozinhos</option>
                    <option value="duplas">Trabalham em Duplas</option>
                    <option value="trios">Trabalham em Trios</option>
                </select>
            </div>

            <div class="input-group">
                <label id="label-qtd-equipes">Quantidade de Duplas:</label>
                <input type="number" id="input-qtd-equipes" value="5">
            </div>

            <button class="btn-calcular" onclick="salvarECalcular()">🔄 Recalcular Custo</button>
        </div>

        <div class="card-resultado">
            <div class="titulo-resumo">Custo de Obra / Dia</div>
            
            <div class="linha-resumo">
                <span>Custo Total M.O. (Mensal)</span>
                <span id="resumo-total-mo">R$ 0,00</span>
            </div>
            
            <div class="linha-resumo">
                <span id="resumo-tempo-label">Nº Dias Trabalhados</span>
                <span id="resumo-tempo-val">0</span>
            </div>

            <div class="linha-resumo">
                <span id="resumo-equipes-label">Nº de Duplas</span>
                <span id="resumo-equipes-val">0</span>
            </div>

            <div class="linha-final linha-resumo">
                <span id="resumo-final-label">Custo por Dupla</span>
                <span id="resumo-final-val">R$ 0,00</span>
            </div>
        </div>

    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        let custoTotalMO = 0;

        // Formatação de Dinheiro
        const formatarMoeda = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);

        // Carrega dados ao abrir
        window.onload = async function() {
            const res = await fetch(`${API_URL}/calculo-obra`);
            const dados = await res.json();
            
            // 1. Salva o Total MO que veio do banco
            custoTotalMO = dados.custoTotalMO;

            // 2. Preenche os inputs com o que estava salvo
            document.getElementById('select-modo').value = dados.config.modo_tempo;
            document.getElementById('input-qtd-tempo').value = dados.config.qtd_tempo;
            document.getElementById('select-tipo-equipe').value = dados.config.tipo_equipe;
            document.getElementById('input-qtd-equipes').value = dados.config.qtd_equipes;

            atualizarLabels();
            realizarCalculoNaTela();
        };

        // Função Visual: Muda os textos (Dias vs Horas, Duplas vs Trios)
        function atualizarLabels() {
            const modo = document.getElementById('select-modo').value;
            const tipo = document.getElementById('select-tipo-equipe').value;

            // Ajusta Label de Equipe
            let textoEquipe = "Quantidade de Pessoas";
            if (modo === 'duplas') textoEquipe = "Quantidade de Duplas";
            if (modo === 'trios') textoEquipe = "Quantidade de Trios";
            document.getElementById('label-qtd-equipes').innerText = `Quantidade de ${capitalize(tipo)}:`;

            // Ajusta Título do Card Verde
            const textoTempo = modo === 'dias' ? 'Dia' : 'Hora';
            document.querySelector('.titulo-resumo').innerText = `Custo de Obra / ${textoTempo}`;
        }

        // Função Lógica: Faz a conta Matemática
        function realizarCalculoNaTela() {
            const modo = document.getElementById('select-modo').value;
            const qtdTempo = parseFloat(document.getElementById('input-qtd-tempo').value);
            const tipoEquipe = document.getElementById('select-tipo-equipe').value;
            const qtdEquipes = parseFloat(document.getElementById('input-qtd-equipes').value);

            // Validação simples
            if (qtdTempo <= 0 || qtdEquipes <= 0) return;

            // A Mágica: Custo Total / (Tempo * Equipes)
            // Ex: 39.000 / (20 dias * 5 duplas) = 394,00
            const custoUnitario = custoTotalMO / (qtdTempo * qtdEquipes);

            // Atualiza o Card Verde (Visualização)
            document.getElementById('resumo-total-mo').innerText = formatarMoeda(custoTotalMO);
            
            document.getElementById('resumo-tempo-label').innerText = modo === 'dias' ? 'Nº Dias' : 'Nº Horas';
            document.getElementById('resumo-tempo-val').innerText = qtdTempo;

            document.getElementById('resumo-equipes-label').innerText = `Nº de ${capitalize(tipoEquipe)}`;
            document.getElementById('resumo-equipes-val').innerText = qtdEquipes;

            document.getElementById('resumo-final-label').innerText = `Custo por ${capitalize(tipoEquipe)}`;
            document.getElementById('resumo-final-val').innerText = formatarMoeda(custoUnitario);
        }

        // Salva no Banco e Recalcula
        async function salvarECalcular() {
            const dados = {
                modo_tempo: document.getElementById('select-modo').value,
                qtd_tempo: document.getElementById('input-qtd-tempo').value,
                tipo_equipe: document.getElementById('select-tipo-equipe').value,
                qtd_equipes: document.getElementById('input-qtd-equipes').value
            };

            await fetch(`${API_URL}/calculo-obra`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dados)
            });

            atualizarLabels();
            realizarCalculoNaTela();
            alert("Cálculo atualizado e salvo!");
        }

        function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
    </script>
</body>
</html>
