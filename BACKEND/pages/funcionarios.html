<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Funcionários</title>
    
    <link rel="stylesheet" href="../css/global.css">
    
    <link rel="stylesheet" href="../css/funcionarios.css"> 
</head>
<body>

    <a href="../index.html" style="text-decoration: none; color: #555; display: inline-block; margin-bottom: 15px;">&larr; Voltar ao Início</a>
    
    <h2>Gerenciamento de Custos Trabalhistas</h2>

    <div class="card-cadastro">
        <div class="grupo-input">
            <label for="input-nome">Nome do Funcionário</label>
            <input type="text" id="input-nome" placeholder="Ex: Gabriel Prates">
        </div>
        <div class="grupo-input">
            <label for="input-salario">Salário Base (R$)</label>
            <input type="number" id="input-salario" placeholder="0,00">
        </div>
        <div class="grupo-input">
            <label for="input-epi">Valor EPI (R$)</label>
            <input type="number" id="input-epi" placeholder="0,00">
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button id="btn-salvar" onclick="salvarFuncionario()" 
                style="background-color: #27ae60; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                + Calcular e Adicionar
            </button>

            <button id="btn-cancelar" onclick="cancelarEdicao()" 
                style="display: none; background-color: #95a5a6; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                Cancelar
            </button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th class="texto-esq">Nome</th>
                <th>Salário</th>
                <th>13º (Prov.)</th>
                <th>1/3 Férias</th>
                <th>Férias (Prov.)</th>
                <th>INSS (Est.)</th>
                <th>Multa FGTS</th>
                <th>EPI</th>
                <th>Somatório</th>
                <th>Ações</th>
            </tr>
        </thead>
        
        <tbody id="tabela-corpo">
            </tbody>

        <tfoot id="tabela-rodape">
            </tfoot>
    </table>

    <script src="../js/funcionarios.js"></script>
</body>
</html>
